<script>
  (function initSplashMicroInteractions() {
    const progressBar = document.getElementById('splash-progress');
    const statusText = document.getElementById('splash-status-text');
    
    if (!progressBar || !statusText) return;

    const stages = [
      { width: '25%', text: 'Verifying institutional certificates...' },
      { width: '60%', text: 'Synchronizing academic network...' },
      { width: '90%', text: 'Preparing peer feed...' },
      { width: '100%', text: 'Ready' }
    ];

    let currentStage = 0;

    const interval = setInterval(() => {
      currentStage++;
      if (currentStage < stages.length) {
        progressBar.style.width = stages[currentStage].width;
        statusText.textContent = stages[currentStage].text;
      } else {
        clearInterval(interval);
      }
    }, 900);
  })();
