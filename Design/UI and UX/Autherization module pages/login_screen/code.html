<h2 class="font-headline-lg text-headline-lg text-on-surface">Welcome Back!</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-space-xs">Sign in to continue your university journey.</p>

<div class="bg-surface-container-lowest rounded-2xl shadow-sm p-space-lg flex flex-col gap-space-md">

<span class="font-label-sm text-label-sm text-primary">.edu verified</span>

</div>
</div>
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface" for="account-password">Password</label>

<span class="material-symbols-outlined absolute left-3.5 text-[20px] text-secondary pointer-events-none transition-colors" id="password-icon">lock</span>
<input autocomplete="current-password" class="w-full h-[52px] pl-11 pr-12 rounded-xl bg-surface-container-low text-on-surface font-body-md text-body-md placeholder:text-outline outline-none transition-all duration-200 focus:bg-surface-container-lowest focus:shadow-[0_0_0_2px_#2563eb]" id="account-password" placeholder="Enter your password" type="password">
<button aria-label="Show password" class="absolute right-1 w-11 h-11 flex items-center justify-center rounded-lg text-secondary hover:text-on-surface active:scale-95 transition-all" id="toggle-password-btn" type="button">

<input checked="" class="sr-only peer" id="remember-me" type="checkbox">

<span class="material-symbols-outlined text-[15px] text-on-primary opacity-0 peer-checked:opacity-100 font-bold transition-opacity">check</span>
</div>
<span class="font-body-md text-body-md text-on-surface-variant group-hover:text-on-surface transition-colors">Remember me</span>
</label>

<div class="flex items-center gap-space-sm">

</div>

</div>
<div class="flex items-center gap-1 text-outline">
<span class="font-label-sm text-label-sm text-tertiary-container bg-surface-container-highest px-2 py-0.5 rounded-full">Active</span>
<span class="material-symbols-outlined text-[18px]">chevron_right</span>
</div>
</button>
<div class="flex items-center justify-center gap-space-xs rounded-xl bg-surface-container-low px-space-sm py-2">
<span class="material-symbols-outlined text-[15px] text-tertiary-container">lock_person</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">256-bit SSL encrypted institutional credentials</span>
</div>
</div>

<p class="font-body-md text-body-md text-on-surface-variant">

          Create Account
        </button>
</p>

<script>
  (function () {
    const passwordInput = document.getElementById('account-password');
    const toggleBtn = document.getElementById('toggle-password-btn');
    const toggleIcon = document.getElementById('toggle-password-icon');
    const emailInput = document.getElementById('university-email');
    const emailIcon = document.getElementById('email-icon');
    const passwordIcon = document.getElementById('password-icon');
    const signInBtn = document.getElementById('sign-in-btn');

    if (toggleBtn && passwordInput && toggleIcon) {
      toggleBtn.addEventListener('click', function () {
        const isHidden = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isHidden ? 'text' : 'password');
        toggleIcon.textContent = isHidden ? 'visibility' : 'visibility_off';
        toggleBtn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
      });
    }

    if (emailInput && emailIcon) {
      emailInput.addEventListener('focus', function () {
        emailIcon.classList.add('text-primary');
        emailIcon.classList.remove('text-secondary');
      });
      emailInput.addEventListener('blur', function () {
        emailIcon.classList.remove('text-primary');
        emailIcon.classList.add('text-secondary');
      });
    }

    if (passwordInput && passwordIcon) {
      passwordInput.addEventListener('focus', function () {
        passwordIcon.classList.add('text-primary');
        passwordIcon.classList.remove('text-secondary');
      });
      passwordInput.addEventListener('blur', function () {
        passwordIcon.classList.remove('text-primary');
        passwordIcon.classList.add('text-secondary');
      });
    }

    if (signInBtn) {
      signInBtn.addEventListener('click', function () {
        const originalText = signInBtn.innerHTML;
        signInBtn.innerHTML = '<span class="material-symbols-outlined text-[19px] animate-spin">progress_activity</span><span>Authenticating...</span>';
        signInBtn.disabled = true;
        setTimeout(function () {
          signInBtn.innerHTML = originalText;
          signInBtn.disabled = false;
        }, 1200);
      });
    }
  })();
</script></main><div class="fixed bottom-0 w-full z-50 pb-safe pointer-events-none flex justify-center items-center h-8"><div class="w-32 h-1 bg-outline-variant/60 rounded-full mb-2"></div></div>
